<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
  <filter id="noise-filter" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" seed="15" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="1.6" intercept="-0.3"/>
      <feFuncG type="linear" slope="1.6" intercept="-0.3"/>
      <feFuncB type="linear" slope="1.6" intercept="-0.3"/>
    </feComponentTransfer>
  </filter>
  <rect width="200" height="200" filter="url(#noise-filter)"/>
</svg>
